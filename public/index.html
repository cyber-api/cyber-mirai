<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{BOT_NAME}} — Cyber Mirai</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --card: rgba(18, 26, 43, 0.82);
      --line: rgba(120, 170, 255, 0.18);
      --text: #e8eefc;
      --muted: #93a4c4;
      --accent: #42c2ff;
      --accent2: #a66cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(66, 194, 255, 0.18), transparent 60%),
        radial-gradient(700px 420px at 95% 0%, rgba(166, 108, 255, 0.16), transparent 55%),
        var(--bg);
    }
    .card {
      width: min(640px, 100%);
      padding: 40px 34px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      text-align: center;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      font-size: 30px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 30px rgba(66, 194, 255, 0.28);
    }
    h1 { margin: 0 0 6px; font-size: clamp(1.6rem, 4vw, 2.1rem); letter-spacing: -0.02em; }
    .sub { margin: 0 0 26px; color: var(--muted); font-size: 0.98rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 26px;
    }
    .stat {
      padding: 14px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
    }
    .stat span { display: block; }
    .stat .label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 6px; }
    .stat .value { font-weight: 650; font-size: 1.02rem; word-break: break-word; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a.button:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.08); }
    a.button.primary {
      border-color: transparent;
      color: #04121d;
      background: linear-gradient(135deg, var(--accent), #8ae0ff);
    }
    footer { margin-top: 26px; color: var(--muted); font-size: 0.78rem; }
    .dot { color: #47ffb2; }
    @media (max-width: 480px) { .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">☢️</div>
    <h1>{{BOT_NAME}}</h1>
    <p class="sub"><span class="dot">●</span> Online — Messenger bot service</p>

    <div class="stats">
      <div class="stat">
        <span class="label">Version</span>
        <span class="value">{{VERSION}}</span>
      </div>
      <div class="stat">
        <span class="label">Uptime</span>
        <span class="value" id="uptime">{{UPTIME}}</span>
      </div>
      <div class="stat">
        <span class="label">Status</span>
        <span class="value" id="status">healthy</span>
      </div>
    </div>

    <div class="actions">
      <a class="button primary" href="/dashboard">Open dashboard</a>
      <a class="button" href="/health">Health JSON</a>
    </div>

    <footer>Cyber Mirai • {{VERSION}} • Asia/Dhaka</footer>
  </main>

  <script>
    (function () {
      var started = Date.now() - (Number("{{UPTIME_SECONDS}}") || 0) * 1000;

      function format(seconds) {
        seconds = Math.max(0, Math.floor(seconds));
        var days = Math.floor(seconds / 86400);
        var hours = Math.floor((seconds % 86400) / 3600);
        var minutes = Math.floor((seconds % 3600) / 60);
        var secs = seconds % 60;
        if (days) return days + "d " + hours + "h " + minutes + "m";
        if (hours) return hours + "h " + minutes + "m " + secs + "s";
        if (minutes) return minutes + "m " + secs + "s";
        return secs + "s";
      }

      function tick() {
        document.getElementById("uptime").textContent = format((Date.now() - started) / 1000);
      }

      tick();
      setInterval(tick, 1000);

      fetch("/health", { cache: "no-store" })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data && data.status === "ok") document.getElementById("status").textContent = "healthy";
        })
        .catch(function () { document.getElementById("status").textContent = "unknown"; });
    })();
  </script>
</body>
</html>
